# Argon Audio Stream2M MK2 remote for ESPHome.
# Extended NEC: ESPHome's address 0x1DCC sends the bytes CC 1D.
# Add a remote_transmitter (IR LED with 38 kHz carrier, or wired to the receiver output) with id: ir

button:
  - platform: template
    name: "Argon Power"
    on_press:
      - remote_transmitter.transmit_nec:
          transmitter_id: ir
          address: 0x1DCC
          command: 0xD52A
  - platform: template
    name: "Argon Mute"
